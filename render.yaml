services:
  # A web service on Render
  - type: web
    name: damask-shop
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    postDeployCommands: 
      - npm run db:push
      - npm run db:seed
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: damask-db
          property: connectionString

databases:
  - name: damask-db
    databaseName: damaskdb
    ipAllowList: [] # only allow internal connections